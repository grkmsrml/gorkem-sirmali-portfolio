# ============================================
# YÖNETİM PANELİ AYARLARI  (/admin)
#
# Panel, content/ klasöründeki dosyaları düzenler ve her kaydı
# GitHub deposuna bir commit olarak yazar. Yayın servisi her
# commit'te siteyi kendiliğinden yeniden kurar.
#
# Yeni bir alan eklemek için: buraya bir satır ekle, sonra
# src/data/ altındaki ilgili dosyada o alanı kullan.
# ============================================

backend:
  name: github
  repo: grkmsrml/gorkem-sirmali-portfolio
  branch: main
  commit_messages:
    create: 'İçerik: {{collection}} eklendi — {{slug}}'
    update: 'İçerik: {{collection}} güncellendi — {{slug}}'
    delete: 'İçerik: {{collection}} silindi — {{slug}}'
    uploadMedia: 'Görsel yüklendi — {{path}}'
    deleteMedia: 'Görsel silindi — {{path}}'

# Yüklenen görseller. .jpg/.png olarak yüklenir; derleme sırasında
# üç boyutlu .webp'e çevrilir (scripts/optimize-images.mjs).
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ------------------------------------------
  # PROJELER — her proje bir dosya
  # ------------------------------------------
  - name: projects
    label: Projeler
    label_singular: Proje
    folder: content/projects
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{fields.slug}}'
    identifier_field: slug
    summary: '{{title.tr}} — {{year}}'
    sortable_fields: [order, year]
    media_folder: /public/images/projects
    public_folder: /images/projects
    fields:
      - name: slug
        label: Adres
        hint: 'Sayfanın adresi: küçük harf, Türkçe karakter yok, boşluk yerine tire. Örn: han-adasi. Sonradan değiştirme.'
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Yalnız küçük harf, rakam ve tire']
      - name: order
        label: Sıra
        hint: Küçük sayı önce gelir. Araya girmek için 15, 25 gibi ara değer ver.
        widget: number
        value_type: int
        default: 5
      - name: title
        label: Başlık
        widget: object
        fields: &line
          - { name: tr, label: Türkçe, widget: string }
          - { name: en, label: English, widget: string, required: false }
      - name: category
        label: Kategori
        widget: select
        options:
          - { label: Mimari Tasarım, value: mimari }
          - { label: Uygulama Projesi, value: uygulama }
          - { label: İç Mekan, value: icmekan }
          - { label: Koruma / Rölöve, value: koruma }
          - { label: Kent / Peyzaj, value: kent }
      - { name: year, label: Yıl, widget: number, value_type: int }
      - { name: location, label: Konum, widget: object, fields: *line }
      - { name: course, label: Ders, widget: object, fields: *line }
      - name: team
        label: Ekip
        hint: Grup çalışmasıysa diğer isimler, virgülle. Tek başına yaptıysan boş bırak.
        widget: string
        required: false
      - { name: featured, label: Ana sayfada göster, widget: boolean, default: false }
      - { name: video, label: Video adresi, widget: string, required: false }
      - name: art
        label: Yedek çizim
        hint: Hiç görsel yokken kartta görünen çizgisel çizim.
        widget: select
        default: plan
        options:
          - { label: Plan, value: plan }
          - { label: Kesit, value: section }
          - { label: Cephe, value: facade }
      - name: cover
        label: Kapak görseli
        hint: Kartlarda görünür. Boş bırakılırsa ilk görsel kullanılır. Render, maket ya da fotoğraf seç; tam pafta küçükken okunmuyor.
        widget: image
        required: false
      - name: images
        label: Görseller
        label_singular: Görsel
        widget: list
        summary: '{{caption.tr}}'
        fields:
          - { name: image, label: Görsel, widget: image }
          - name: caption
            label: Başlık
            widget: object
            fields: &line_optional
              - { name: tr, label: Türkçe, widget: string, required: false }
              - { name: en, label: English, widget: string, required: false }
      - name: summary
        label: Özet
        hint: Bir-iki cümle; başlığın altında ve katalogda görünür.
        widget: object
        fields: &para
          - { name: tr, label: Türkçe, widget: text }
          - { name: en, label: English, widget: text, required: false }
      - name: description
        label: Açıklama
        hint: Paragrafları boş satırla ayır.
        widget: object
        fields: &rich
          - { name: tr, label: Türkçe, widget: markdown, minimal: true }
          - { name: en, label: English, widget: markdown, minimal: true, required: false }

  # ------------------------------------------
  # BLOG — her yazı bir dosya
  # ------------------------------------------
  - name: blog
    label: Blog
    label_singular: Yazı
    folder: content/blog
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{fields.slug}}'
    identifier_field: slug
    summary: '{{title.tr}} — {{date}}'
    sortable_fields: [date]
    media_folder: /public/images/blog
    public_folder: /images/blog
    fields:
      - name: slug
        label: Adres
        hint: 'Küçük harf, Türkçe karakter yok, boşluk yerine tire. Örn: butunleyici-vatan'
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Yalnız küçük harf, rakam ve tire']
      - { name: title, label: Başlık, widget: object, fields: *line }
      - name: category
        label: Kategori
        widget: select
        options:
          - { label: Gezi, value: gezi }
          - { label: Kuram, value: kuram }
          - { label: Bilim-Kurgu, value: kurgu }
          - { label: Atölye, value: atolye }
          - { label: Not, value: not }
      - name: date
        label: Tarih
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD.MM.YYYY
        time_format: false
      - name: excerpt
        label: Özet
        hint: Yazı listesinde görünen bir-iki cümle.
        widget: object
        fields: *para
      - name: body
        label: Metin
        hint: Okuma süresi kendiliğinden hesaplanır. İngilizce boşsa Türkçe metin gösterilir.
        widget: object
        fields: *rich

  # ------------------------------------------
  # TEK DOSYALAR
  # ------------------------------------------
  - name: pages
    label: Fotoğraflar ve Kişisel
    files:
      - name: photos
        label: Fotoğraflar
        file: content/photos.json
        media_folder: /public/images/photos
        public_folder: /images/photos
        fields:
          - name: photos
            label: Fotoğraflar
            label_singular: Fotoğraf
            hint: Sürükleyerek sırala. Yatay / dikey oranı kendiliğinden bulunur.
            widget: list
            summary: '{{caption.tr}}'
            fields:
              - { name: image, label: Fotoğraf, widget: image }
              - { name: caption, label: 'Başlık (yer, yıl)', widget: object, fields: *line_optional }

      - name: personal
        label: Kişisel bilgiler
        file: content/personal.json
        media_folder: /public/cv
        public_folder: /cv
        fields:
          - name: profile
            label: Profil
            widget: object
            fields:
              - { name: name, label: Ad Soyad, widget: string }
              - { name: title, label: Unvan, widget: object, fields: *line }
              - { name: location, label: Konum, widget: object, fields: *line }
              - name: intro
                label: Kısa tanıtım
                hint: Hakkımda sayfasının solundaki iki-üç cümle.
                widget: object
                fields: *para
              - { name: bio, label: Biyografi, widget: object, fields: *rich }
          - name: contact
            label: İletişim
            widget: object
            fields:
              - { name: email, label: E-posta, widget: string }
              - { name: phone, label: 'Telefon (sitede gösterilmez)', widget: string, required: false }
              - name: social
                label: Sosyal hesaplar
                label_singular: Hesap
                hint: Adresi boş bırakılan hesap sitede görünmez.
                widget: list
                summary: '{{label}}'
                fields:
                  - name: id
                    label: Simge
                    widget: select
                    options: [linkedin, instagram, github]
                  - { name: label, label: Ad, widget: string }
                  - { name: url, label: Adres, widget: string, required: false }
          - name: cvFiles
            label: CV dosyaları
            widget: object
            fields:
              - { name: tr, label: Türkçe PDF, widget: file, required: false }
              - { name: en, label: İngilizce PDF, widget: file, required: false }
          - name: education
            label: Eğitim
            label_singular: Okul
            widget: list
            summary: '{{institution.tr}}'
            fields:
              - { name: institution, label: Kurum, widget: object, fields: *line }
              - { name: program, label: Bölüm, widget: object, fields: *line }
              - { name: start, label: Başlangıç yılı, widget: number, value_type: int }
              - { name: end, label: 'Bitiş yılı (sürüyorsa boş)', widget: number, value_type: int, required: false }
          - name: experience
            label: Deneyim
            label_singular: Deneyim
            widget: list
            summary: '{{org.tr}} — {{role.tr}}'
            fields:
              - { name: id, label: Kısa ad, widget: string }
              - { name: org, label: Kurum, widget: object, fields: *line }
              - { name: role, label: Görev, widget: object, fields: *line }
              - { name: project, label: Proje, widget: object, fields: *line_optional }
              - { name: period, label: Dönem, widget: object, fields: *line }
              - { name: year, label: Yıl, widget: number, value_type: int }
              - { name: description, label: Açıklama, widget: object, fields: *para }
          - name: involvement
            label: 'Projeler, araştırmalar, gönüllü çalışmalar'
            label_singular: Çalışma
            widget: list
            summary: '{{year}} — {{title.tr}}'
            fields:
              - { name: id, label: Kısa ad, widget: string }
              - { name: title, label: Başlık, widget: object, fields: *line }
              - { name: org, label: 'Kurum / kişiler', widget: object, fields: *line_optional }
              - { name: year, label: Yıl, widget: number, value_type: int }
              - { name: description, label: Açıklama, widget: object, fields: *para }
          - name: leadership
            label: Liderlik
            label_singular: Görev
            widget: list
            summary: '{{title.tr}}'
            fields:
              - { name: title, label: Başlık, widget: object, fields: *line }
              - { name: note, label: Not, widget: object, fields: *line_optional }
          - name: coursework
            label: Dersler
            widget: object
            fields:
              - { name: summary, label: Özet, widget: object, fields: *para }
              - { name: note, label: Not, widget: object, fields: *para }
          - name: software
            label: Yazılımlar
            hint: 'Her satıra bir yazılım. Seviye eklemek istersen yanına yaz: Revit (ileri)'
            widget: list
            field: { name: name, label: Yazılım, widget: string }
          - name: languages
            label: Diller
            label_singular: Dil
            widget: list
            summary: '{{name.tr}} — {{level.tr}}'
            fields:
              - { name: name, label: Dil, widget: object, fields: *line }
              - { name: level, label: Seviye, widget: object, fields: *line }
          - name: competencies
            label: Yetkinlikler
            label_singular: Yetkinlik
            widget: list
            summary: '{{tr}}'
            fields: *line
